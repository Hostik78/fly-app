<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <!-- Цвета - из текущей дизайн-системы "Стекло" (см. index.css, токен fly-accent):
       тёплый кремовый фон, тёплый тёмный "Fl", синий акцент "y" - раньше акцент
       "y" был коралловым (направление "Живой") - значок на экране Домой должен
       совпадать с тем, что видно внутри самого приложения, а не отставать от него. -->
  <rect width="512" height="512" fill="#FFF6F1"/>
  <text x="256" y="300" font-family="Arial, Helvetica, sans-serif" font-size="160" font-weight="700" text-anchor="middle">
    <tspan fill="#241726">Fl</tspan><tspan fill="#4FA6E8">y</tspan>
  </text>
</svg>
