<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <!-- logo-source.svg - тот же файл, из которого генератор (pwa-assets.config.ts)
         делает все остальные значки, а не отдельная копия - раньше это был
         отдельный favicon.svg с продублированными цветами, и при редизайне ("Живой")
         обновили только logo-source.svg, а этот дубликат чуть не остался старым. -->
    <link rel="icon" href="/logo-source.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon-180x180.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- Цвет строки браузера (адресная строка в обычной вкладке) - отдельный от
         theme_color в manifest.webmanifest механизм (тот работает только для уже
         установленного PWA) - без этого тега обычная вкладка в браузере (до
         установки) показывала бы стандартный белый/системный цвет вместо тона
         приложения. Два тега с media - браузер сам выбирает подходящий по
         системной настройке (см. тёмную тему в index.css) - как и с самим
         приложением, ручного переключателя тут нет и не нужно: строка браузера
         вне установленного PWA - решение самой ОС/браузера, не наше. -->
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#fff6f1" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#060708" />
    <!--
      iOS ориентируется на эти теги сильнее, чем на manifest.webmanifest (тот
      в основном для Android/десктопных браузеров) - без них "Добавить на экран
      Домой" в Safari открывало бы приложение как обычную вкладку браузера
      (с адресной строкой и кнопками навигации), а не как отдельное приложение.
    -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <!-- default - тёмный текст на светлой строке статуса, подходит под светлый фон приложения -->
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Fly" />
    <title>Fly</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
